# Thực nghiệm chính: các chế độ huấn luyện (configs/base.yaml, train_modes) trên cùng dữ liệu, cùng protocol, cùng số
# Gaussian cuối:
#   default   3DGS, DefaultStrategy (baseline)
#   mcmc      3DGS-MCMC (Kheradmand et al., 2024)
# Chạy trên pod (một việc nền; dữ liệu còn thiếu thì tự tải; lượt đã xong tự bỏ qua; mọi file kết quả được giữ):
#   VOLUME_GB=<dung lượng volume> bash scripts/pod/run_experiment.sh main --background
# Thêm một chế độ vào `modes` rồi chạy lại: chỉ các lượt của chế độ đó được train, lượt default / mcmc đã xong được dùng
# lại (cap_max của chế độ preset mcmc lấy từ lượt default cùng cảnh, cùng seed). Thiết kế: docs/design/experiments.md mục 2.

name: main
description: "default / mcmc trên Deep Blending (2 cảnh) và 4 cảnh trong nhà của Mip-NeRF 360; 3 seed; 30.000 vòng"
modes: [default, mcmc]   # default chạy trước trên mỗi cảnh và seed: mcmc lấy cap_max từ nó
seeds: [42, 43, 44]      # chạy xen kẽ: seed 42 trên mọi cảnh trước, rồi 43, rồi 44
benchmarks:
  - dataset: deep_blending
    scenes: [drjohnson, playroom]
    b0: true    # B0 Inria trước: điều kiện để dùng default (gsplat) làm baseline (docs/design/training_modes.md mục 1)
  - dataset: mipnerf360
    scenes: [room, counter, kitchen, bonsai]   # indoor_scenes của configs/mipnerf360.yaml
    b0: false   # không bắt buộc; số Inria công bố là trung bình 9 cảnh nên không đối chiếu được với 4 cảnh

# Ước lượng trên RTX 4090, chỉ để in ra và kiểm tra chỗ trống trước khi chạy (không phải kết quả):
#   - Thời gian: Deep Blending theo số đo ở docs/ENVIRONMENT_AUDIT.md mục 7 (B0 49,5 phút; default + mcmc 74 phút
#     mỗi seed); Mip-NeRF 360 chưa đo (giả định khoảng 2,5 giờ mỗi seed cho 4 cảnh × 2 chế độ).
#   - Dung lượng thêm vào volume, giữ mọi file: Deep Blending khoảng 19 GB (checkpoint và PLY mỗi file 236 byte mỗi Gaussian,
#     số Gaussian theo cùng số đo, cộng ảnh render và video); Mip-NeRF 360 khoảng 22–30 GB (số Gaussian chưa đo, cộng ảnh
#     PNG thu nhỏ gsplat ghi một lần cho mỗi cảnh); B0 và dữ liệu khoảng 7 GB. File zip tải về bị xóa sau khi giải nén.
#   Kiểm tra chỗ trống (scripts/pod/run_experiment.sh): lượt chưa xong tính theo dung lượng thật của lượt cùng cảnh,
#   cùng chế độ đã xong ở seed khác; chưa có thì theo disk_gb chia đều cho mọi lượt (src/training/experiment.py).
#   Chạy riêng một phương pháp (run_experiment.sh main --only <phương pháp>; notebook app/notebooks/b0_inria.ipynb,
#   gsplat_default.ipynb, gsplat_mcmc.ipynb), cùng căn cứ:
#   - b0: 49,5 phút đo được, gồm cả tải dữ liệu; B0 hai cảnh và dữ liệu Deep Blending, khoảng 5 GB (chưa đo riêng).
#   - default: trên Deep Blending, default train khoảng 48 % thời gian của default + mcmc (số đo cùng ngày), nên lấy
#     khoảng một nửa phần gsplat: 3 seed × (37 phút Deep Blending + 75 phút Mip-NeRF 360) ≈ 5,6 giờ; khoảng một nửa
#     dung lượng gsplat (10 + 11–15 GB) cộng dữ liệu, khoảng 30 GB.
#   - mcmc: tính cả default khi chưa có lượt default (như phần gsplat của main: 11,2 giờ, ghi 12 cho dư; khoảng 54 GB);
#     lượt default đã xong (chạy sau notebook default hoặc main) thì chỉ còn khoảng một nửa.
estimate:
  gpu_hours: 12
  disk_gb: 56
  only:
    b0: {gpu_hours: 1, disk_gb: 5}
    default: {gpu_hours: 6, disk_gb: 30}
    mcmc: {gpu_hours: 12, disk_gb: 54}
