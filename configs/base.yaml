# Cấu hình chung của SpatialRoom3D, dùng cho mọi luồng dữ liệu.
#
# Đường dẫn viết theo ${WS}: thư mục gốc của network volume (mặc định /workspace trên Runpod; đặt biến WS khi khác).
# Mỗi luồng dữ liệu có một file riêng: configs/<tên>.yaml (liệt kê ở `datasets` bên dưới).
# Đổi đường dẫn trên một pod mà không sửa file trong Git:
#   - configs/local.yaml (không đưa lên Git), cùng cấu trúc, chỉ ghi khóa cần đổi, ví dụ
#       datasets:
#         mipnerf360:
#           root: ${WS}/data/MipNeRF360
#   - hoặc biến môi trường SR3D_DATA_<TÊN> cho thư mục gốc dữ liệu (vd. SR3D_DATA_MIPNERF360=/workspace/data/m360).
# Kiểm tra (chỉ đọc): bash scripts/pod/check_datasets.sh. Bố cục: docs/design/architecture.md.

code_dir: ${WS}/SpatialRoom3D

# Các luồng dữ liệu; mỗi tên là một file configs/<tên>.yaml.
datasets:
  - deep_blending
  - mipnerf360
  - custom_scene

# Hai chế độ huấn luyện 3DGS trên gsplat, dùng chung cho mọi luồng (docs/design/training_modes.md).
train_modes:
  name: train_modes_gsplat
  description: "Hai chế độ huấn luyện 3DGS trên gsplat: DefaultStrategy (baseline) và MCMCStrategy. Xem docs/design/training_modes.md"
  trainer:
    name: gsplat examples/simple_trainer.py
    repo: https://github.com/nerfstudio-project/gsplat
    commit: 6e8c837f35c9b025c0e92fb07bfda4e7c9361c49
  baseline_mode: default
  default_seed: 42
  # Quy ước chung; benchmark chỉ đổi theo quy ước của chính benchmark đó (vd. data_factor của Mip-NeRF 360).
  protocol:
    data_factor: 1
    test_every: 8
    max_steps: 30000
    lpips_net: vgg
    antialiased: false
    save_ply: true
    disable_video: false
    init_type: sfm
  modes:
    default:
      description: "3DGS, DefaultStrategy (heuristic densification của Kerbl et al. 2023) - baseline"
      preset: default
      args: {}
    mcmc:
      description: "3DGS-MCMC (Kheradmand et al. 2024), MCMCStrategy; cùng protocol và cùng số Gaussian cuối với baseline trên cùng cảnh"
      preset: mcmc
      args: {}
      cap_max:
        policy: match_baseline  # = số Gaussian cuối của lượt default cùng cảnh, cùng seed, cùng protocol (không có số cố định)
    # Chế độ của riêng bạn: thêm vào đây rồi gọi bash scripts/run_train.sh custom <cảnh> <tên>, ví dụ
    #   mcmc_or001:
    #     description: "mcmc, opacity_reg 0.001"
    #     preset: mcmc                        # default | mcmc
    #     args: {opacity_reg: 0.001}          # tham số của simple_trainer.py (khóa protocol không đặt ở đây); sr3d.kr: true,
    #                                         # sr3d.mono: true bật biến thể có code (docs/design/training_modes.md mục 3.1)
    #     cap_max: {policy: match_baseline}   # hoặc {policy: fixed, value: 2000000}
    # Thêm protocol: {max_steps: 40000} để đổi protocol (bị ghi là sai khác; match_baseline khi đó cần lượt default
    # cùng protocol). Đổi cho một lượt thì không cần sửa file này: --set / --protocol / --cap-max kèm TAG
    # (docs/design/training_modes.md mục 3).
