# Công cụ xử lý dữ liệu (COLMAP, ffmpeg) trong conda env riêng "gs-tools".
# File được scripts/setup/setup_data_tools.sh đọc (cú pháp bash KEY=VALUE).
#
# COLMAP 4.2.1 là bản mới nhất trên conda-forge khi kiểm tra ngày 09/10/2026,
# có bản build CUDA và bản CPU.
# Lưu ý: từ COLMAP 3.13, tùy chọn GPU đổi tên (SiftExtraction.use_gpu -> FeatureExtraction.use_gpu),
# nên dùng src/reconstruction/colmap_runner.py thay cho convert.py gốc của Inria.

COLMAP_VERSION="4.2.1"
# "cuda" = bản build có CUDA (SIFT trên GPU); "cpu" = bản CPU (chậm hơn, dùng khi driver không hợp)
COLMAP_BUILD="cuda"
# Bản CUDA của colmap 4.2.1 trên conda-forge chỉ có build cuda_129 và cuda_134 (kiểm tra 17/10/2026),
# nên driver phải hỗ trợ CUDA >= 12.9. Driver thấp hơn thì setup_data_tools.sh tự dùng bản CPU.
# Lượt chạy 17/10/2026 (driver 570, CUDA 12.8): conda báo "nothing provides __cuda >=12.9".
COLMAP_CUDA_MIN="12.9"
