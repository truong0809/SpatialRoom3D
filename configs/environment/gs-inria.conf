# Phiên bản ghim cho môi trường 3DGS gốc của Inria (baseline B0).
# File được scripts/setup/setup_3dgs_inria.sh đọc (cú pháp bash KEY=VALUE).
#
# TRẠNG THÁI: TẠM THỜI. Các giá trị PyTorch/CUDA sẽ được chốt sau khi có báo cáo
# env_probe.sh (Bước 1). Quy tắc chọn: biến thể CUDA của PyTorch (TORCH_CUDA)
# không được mới hơn phiên bản CUDA mà driver của pod hỗ trợ (dòng "CUDA Version"
# trong nvidia-smi). Xem docs/ENVIRONMENT_AUDIT.md.

ENV_STATUS="provisional"

# Bản vá Python ghim đúng bản đã cài trên pod (17/10/2026); conda-forge có sẵn bản này.
PYTHON_VERSION="3.10.22"
TORCH_VERSION="2.7.1"
TORCHVISION_VERSION="0.22.1"
TORCH_CUDA="cu128"

# Kiến trúc GPU build sẵn cho CUDA extension:
# 8.0 = A100, 8.6 = RTX A6000 / A40 / RTX 3090, 8.9 = RTX 4090 / L40S, 9.0 = H100.
TORCH_CUDA_ARCH_LIST="8.0;8.6;8.9;9.0"

# Repo Inria ghim theo commit (commit mới nhất trên nhánh main khi kiểm tra ngày 09/10/2026).
INRIA_REPO="https://github.com/graphdeco-inria/gaussian-splatting"
INRIA_COMMIT="54c035f7834b564019656c3e3fcc3646292f727d"

# Mirror GitHub cho submodule simple-knn, chỉ dùng khi gitlab.inria.fr chặn truy cập tự động.
# Đã kiểm tra ngày 09/10/2026: mirror chứa đúng commit 86710c2 mà repo Inria ghim,
# nên mã nguồn lấy về giống hệt bản gốc.
SIMPLE_KNN_MIRROR="https://github.com/camenduru/simple-knn.git"

# Phụ thuộc Python của bước 6 (ghim theo lượt cài trên pod ngày 17/10/2026).
INRIA_LOCK_FILE="configs/environment/gs-inria.lock.txt"

# Bộ cài conda (dùng chung cho mọi env trong /workspace/miniforge3). Ghim phiên bản thay vì "latest"
# để lần cài lại trên pod mới cho cùng conda; 26.7.2-0 là bản đã cài trên pod ngày 17/10/2026.
MINIFORGE_VERSION="26.7.2-0"
