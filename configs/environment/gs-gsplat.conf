# Phiên bản ghim cho env gs-gsplat: hai chế độ huấn luyện Default / MCMC (docs/design/training_modes.md).
# Đọc bởi scripts/setup/setup_gsplat.sh. Chốt (bỏ "provisional") cùng lúc với gs-inria.conf, sau báo cáo scripts/setup/env_probe.sh.
ENV_STATUS="provisional"

PYTHON_VERSION="3.10.22"  # giống gs-inria.conf
# Giữ giống gs-inria.conf để hai bản cài đặt dùng cùng PyTorch/CUDA (setup_gsplat.sh cảnh báo nếu khác).
TORCH_VERSION="2.7.1"
TORCHVISION_VERSION="0.22.1"
TORCH_CUDA="cu128"
TORCH_CUDA_ARCH_LIST="8.0;8.6;8.9;9.0"

# gsplat: commit 6e8c837 (22/08/2025) = bản phát hành v1.5.3 + 4 commit. Commit này sửa lỗi của v1.5.3
# khiến DefaultStrategy không bao giờ reset opacity (biểu thức "step % reset_every == 0 & step > 0").
# Thư viện và examples/ (simple_trainer.py, datasets/colmap.py) lấy từ cùng commit, không trộn phiên bản.
GSPLAT_REPO="https://github.com/nerfstudio-project/gsplat.git"
GSPLAT_COMMIT="6e8c837f35c9b025c0e92fb07bfda4e7c9361c49"

# fused-ssim đúng commit mà examples/requirements.txt của gsplat @ 6e8c837 yêu cầu (khác commit trong repo Inria).
FUSED_SSIM_REPO="https://github.com/rahul-goel/fused-ssim.git"
FUSED_SSIM_COMMIT="328dc9836f513d00c4b5bc38fe30478b4435cbb5"

# Phụ thuộc Python còn lại, ghim đủ cả phụ thuộc gián tiếp (không gồm torch/torchvision).
LOCK_FILE="configs/environment/gs-gsplat.lock.txt"

# Bộ cài conda dùng chung với gs-inria (xem gs-inria.conf).
MINIFORGE_VERSION="26.7.2-0"
